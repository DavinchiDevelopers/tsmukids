# CMS fallbacks + block data directory
rewrite ^/$ /ru/ permanent;

location ^~ /data/ {
    deny all;
    return 403;
}

location ~ ^/(?<lng>ru|uz)/services/ {
    try_files $uri $uri/ /$lng/services/fallback/index.html;
}

location ~ ^/(?<lng>ru|uz)/doctors/ {
    try_files $uri $uri/ /$lng/doctors/fallback/index.html;
}

location ~ ^/(?<lng>ru|uz)/departments/ {
    try_files $uri $uri/ /$lng/departments/fallback/index.html;
}
